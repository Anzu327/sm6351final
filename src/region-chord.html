<div id="region-chord-anchor">
<section id="region-chord" aria-labelledby="region-chord-title">
  <div class="chord-inner">
    <h2 id="region-chord-title">Meteorites by region</h2>
    <div class="chord-panel">
      <svg class="chord-chart" viewBox="-550 -550 1100 1100" role="group" aria-labelledby="region-bundling-label" aria-describedby="region-bundling-description">
        <title id="region-bundling-label">Hierarchical edge bundling by region and meteorite class</title>
        <desc id="region-bundling-description">Line color shows the region group and width shows the number of records. Select a label to see its connections.</desc>
      </svg>
    </div>
  </div>
  <aside class="chord-key" aria-labelledby="chord-key-title">
    <h3 id="chord-key-title">Ordinary chondrites</h3>
    <dl>
      <div><dt>H</dt><dd>High total iron</dd></div>
      <div><dt>L</dt><dd>Low total iron</dd></div>
      <div><dt>LL</dt><dd>Low total iron and little metallic iron</dd></div>
    </dl>
    <p><strong>4–6</strong> indicate increasing thermal alteration within the parent asteroid.</p>
    <p><strong>LL5</strong> is an LL chondrite of petrologic type 5.</p>
  </aside>
</section>
</div>
<section class="chelyabinsk-outro" id="chelyabinsk-outro" aria-labelledby="outro-title">
  <div class="outro-stage">
    <img class="outro-museum" width="1672" height="941" alt="An illustrated re-creation of children celebrating around a museum exhibit">
    <svg class="outro-wake" aria-hidden="true" preserveAspectRatio="none">
      <defs>
        <linearGradient id="outro-wake-ink" gradientUnits="userSpaceOnUse">
          <stop stop-color="#9cb7e9" stop-opacity="0"/>
          <stop offset=".58" stop-color="#bcd3fb" stop-opacity=".36"/>
          <stop offset="1" stop-color="#ecf4ff"/>
        </linearGradient>
      </defs>
      <path fill="none" stroke="url(#outro-wake-ink)" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <canvas class="outro-canvas" aria-hidden="true"></canvas>
    <img class="outro-specimen" width="460" height="330" alt="Chelyabinsk meteorite on display">
    <div class="outro-caption outro-birthday">
      <h2 id="outro-title">Ten years later</h2>
    </div>
  </div>
</section>
