<section id="region-chord" aria-labelledby="region-chord-title">
  <div class="chord-inner">
    <h2 id="region-chord-title">Meteorites by region</h2>
    <div class="chord-layout">
      <div role="group" class="chord-regions" aria-labelledby="chord-regions-label">
        <h3 id="chord-regions-label">Region</h3>
        <div class="chord-options"></div>
      </div>
      <svg class="chord-chart" viewBox="-212 -212 424 424" aria-hidden="true"></svg>
      <div role="group" class="chord-classes" aria-labelledby="chord-classes-label">
        <h3 id="chord-classes-label">Meteorite class</h3>
        <div class="chord-options"></div>
      </div>
    </div>
    <div class="chord-footer">
      <span class="chord-count" aria-live="polite"></span>
      <button type="button" class="chord-reset" disabled>Reset</button>
    </div>
  </div>
</section>
