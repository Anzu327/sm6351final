name: Verify experience
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Check source types
        run: npm run typecheck
      - name: Verify complete source-backed data snapshots
        run: npm run check:data
      - name: Build production website
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Exercise the story and atlas
        id: browser
        run: npm test
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            qa-screenshots/
            playwright-report/
            test-results/
          retention-days: 14
      - name: Preserve production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: production-site
          path: dist/
          retention-days: 14
      - name: Record QA evidence through the GitHub API
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          VERIFY_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const owner=context.repo.owner, repo=context.repo.repo;
            const branch=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            if(branch.data.commit.sha!==context.sha) { core.notice('Main changed; skip evidence commit to avoid mixing revisions.'); return; }
            const entries=[];
            const paths=fs.existsSync('qa-screenshots')?fs.readdirSync('qa-screenshots').filter(p=>p.endsWith('.png')):[];
            for(const name of paths) {
              const blob=await github.rest.git.createBlob({owner,repo,content:fs.readFileSync('qa-screenshots/'+name).toString('base64'),encoding:'base64'});
              entries.push({path:'docs/qa/'+name,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            if(fs.existsSync('package-lock.json')) entries.push({path:'package-lock.json',mode:'100644',type:'blob',content:fs.readFileSync('package-lock.json','utf8')});
            entries.push({path:'docs/qa/run.json',mode:'100644',type:'blob',content:JSON.stringify({sourceSha:context.sha,status:process.env.VERIFY_STATUS,runUrl:'https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,screenshots:paths,recordedAt:new Date().toISOString()},null,2)+'\n'});
            const commit=await github.rest.git.getCommit({owner,repo,commit_sha:context.sha});
            const tree=await github.rest.git.createTree({owner,repo,base_tree:commit.data.tree.sha,tree:entries});
            const next=await github.rest.git.createCommit({owner,repo,message:'chore: record remote QA evidence and dependency lock',tree:tree.data.sha,parents:[context.sha]});
            await github.rest.git.updateRef({owner,repo,ref:'heads/main',sha:next.data.sha,force:false});
